# Publishes the two container images of a guard deployment to GHCR on every
# v* tag, and on demand:
#
#   ghcr.io/<owner>/guard-server   the `server` target of deploy/Dockerfile
#                                  (guard serve)
#   ghcr.io/<owner>/guard-sandbox  deploy/sandbox/Dockerfile (the image every
#                                  agent runs in)
#
# Each job prints the pushed digest. The agent lane only accepts an image
# pinned as <repo>@sha256:<64 hex> (docs/contracts/agents-toml.md), so the
# sandbox digest is what goes into [scheduler].image, or into
# GUARD_SANDBOX_IMAGE on Dokploy (deploy/DOKPLOY.md).
#
# A tag push publishes <image>:<tag>. A manual run publishes
# <image>:sha-<commit>. Nothing is tagged `latest`: consumers pin the digest.
# Images are linux/amd64, the runner's own architecture. A new GHCR package
# starts private: make it public, or pull it once on the deployment host after
# `docker login ghcr.io` there. ci/tests/images.test.mjs checks this file.
name: images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write   # docker push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: guard-server
            dockerfile: deploy/Dockerfile
            context: .
            target: server
          - image: guard-sandbox
            dockerfile: deploy/sandbox/Dockerfile
            context: deploy/sandbox
            target: ''
    env:
      IMAGE: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      CONTEXT: ${{ matrix.context }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Name the image
        id: name
        run: |
          # GHCR rejects upper-case repository names.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="sha-${GITHUB_SHA:0:12}"
          fi
          echo "repository=ghcr.io/${owner}/${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${owner}/${IMAGE}:${tag}" >> "$GITHUB_OUTPUT"

      # BuildKit is the default builder of the runner's Docker; deploy/Dockerfile
      # needs it (cache mounts, deploy/Dockerfile.dockerignore).
      - name: Build
        env:
          IMAGE_REF: ${{ steps.name.outputs.ref }}
        run: |
          set -- --file "$DOCKERFILE" --tag "$IMAGE_REF" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          if [ -n "$TARGET" ]; then
            set -- "$@" --target "$TARGET"
          fi
          docker build "$@" "$CONTEXT"

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push and print the digest
        env:
          IMAGE_REPOSITORY: ${{ steps.name.outputs.repository }}
          IMAGE_REF: ${{ steps.name.outputs.ref }}
        run: |
          docker push "$IMAGE_REF"
          # The registry's digest of what was pushed: <repository>@sha256:<64 hex>.
          digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE_REF" \
            | grep -F "${IMAGE_REPOSITORY}@sha256:" | head -n 1 || true)"
          if ! printf '%s\n' "$digest" | grep -Eq '^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$'; then
            echo "error: no digest reported for ${IMAGE_REF}" >&2
            exit 1
          fi
          echo "digest: ${digest}"
          {
            echo "### ${IMAGE}"
            echo
            echo "- tag: \`${IMAGE_REF}\`"
            echo "- digest: \`${digest}\`"
            if [ "$IMAGE" = guard-sandbox ]; then
              echo "- agents.toml: \`[scheduler] image = \"${digest}\"\`"
              echo "- Dokploy: \`GUARD_SANDBOX_IMAGE=${digest}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
